<style>
  .nav-link { transition: color var(--dur) var(--ease-out); }
  .nav-link:hover { color: var(--color-brand-press); }
  .prop-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
  @media (max-width: 980px) { .prop-grid { grid-template-columns: repeat(2, 1fr) !important; } }
  @media (max-width: 680px) {
    .prop-grid { grid-template-columns: 1fr !important; }
    .main-nav { display: none !important; }
    .header-phone-label { display: none !important; }
    .cta-band { flex-direction: column !important; align-items: flex-start !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<!-- Netlify Forms detection (hidden). The Get Notified modal posts to this form
     name; Netlify emails each submission to paul@. Field names must match. -->
<form name="get-notified" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="text" name="name" />
  <input type="text" name="contact-pref" />
  <input type="email" name="email" />
  <input type="tel" name="phone" />
  <input type="checkbox" name="sms-consent" />
  <input type="text" name="page" />
  <input type="text" name="bot-field" />
</form>
<script src="/homes/data.js?v=6"></script>
<script src="/homes/sheet-loader.js?v=9"></script>
<!-- Precompiled from *.jsx by `npm run build` (no in-browser Babel). -->
<script src="/homes/listing-components.js?v=26"></script>
<script src="/homes/landing.js?v=15"></script>
<script src="/homes/app-index.js?v=10"></script>
</body>
</html>
