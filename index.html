<script type="text/babel">
  function App() {
    const [offerOpen, setOfferOpen] = React.useState(false);
    const openOffer = () => setOfferOpen(true);

    React.useEffect(() => {
      if (window.lucide) window.lucide.createIcons();
    });

    return (
      <React.Fragment>
        <Header onOffer={openOffer} />
        <main>
          <Hero onOffer={openOffer} />
          <TrustStrip />
          <HowItWorks onOffer={openOffer} />
          <Benefits />
          <FAQ />
          <ServiceArea />
          <FinalCTA onOffer={openOffer} />
        </main>
        <Footer onOffer={openOffer} />
        <OfferModal open={offerOpen} onClose={() => setOfferOpen(false)} />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
